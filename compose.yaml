services:
  webui:
    image: ${MCWEB_IMAGE:-mc-server-webui:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      MCWEB_LAN_SERVER_ADDRESS: ${MCWEB_LAN_SERVER_ADDRESS:-192.168.101.41:25565}
      MCWEB_SERVER_ADDRESS: ${MCWEB_SERVER_ADDRESS:-}
      MCWEB_SECURE_COOKIE: ${MCWEB_SECURE_COOKIE:-false}
      MCWEB_PLUG_IP: ${MCWEB_PLUG_IP:-}
      MCWEB_PLUG_TOKEN: ${MCWEB_PLUG_TOKEN:-}
      MCWEB_PLUG_MODEL: ${MCWEB_PLUG_MODEL:-}
      MCWEB_PLUG_SWITCH_SIID: ${MCWEB_PLUG_SWITCH_SIID:-}
      MCWEB_PLUG_SWITCH_PIID: ${MCWEB_PLUG_SWITCH_PIID:-}
    ports:
      - "${MCWEB_HTTP_PORT:-8080}:8080"
    volumes:
      - ./data:/data
