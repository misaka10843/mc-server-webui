[project]
name = "mc-server-webui"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "argon2-cffi>=23,<26",
    "python-miio>=0.5.12,<1",
    "tzdata>=2024.1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "mihome-ctl==0.7.0",
    "asyncssh>=2.21,<3",
]

[tool.pytest.ini_options]
pythonpath = ["agent", "backend"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
]
